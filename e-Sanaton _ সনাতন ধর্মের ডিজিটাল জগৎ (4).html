.mu{color:var(--mu);font-size:14px}
.sl{font-size:20px;white-space:pre-line;background:var(--hi);border-radius:12px;padding:12px 16px;margin:8px 0}

.cal .t{outline:2px solid var(--ac)}
.ev{display:block;color:var(--ac2);font-size:11px;line-height:1.3}

textarea{min-height:140px}

a{color:var(--ac2)}
footer{text-align:center;color:var(--mu);font-size:13px;padding:26px 0 30px}
.hide{display:none}

.ekc{border-left:4px solid #7a3fc4}

var VFB=[{title:"প্রাণ পুরুষ শ্রী শ্রী জয়দেব ঠাকুরের বাকেরগঞ্জে আগমন । HISCOHER ।",url:"https://youtu.be/WBFZG3OnEoI"},{title:"ধর্মীয় ভিডিও ২",url:"https://youtu.be/3EpHxPLWEEE"},{title:"ধর্মীয় ভিডিও ৩",url:"https://youtu.be/l8gJpdB5qmI"}].concat([["শ্রীমদ্ভগবদ্গীতা পাঠ ও ব্যাখ্যা","গীতা পাঠ বাংলা"],["হরিনাম সংকীর্তন","হরিনাম কীর্তন বাংলা"],["শ্রীমদ্ভাগবত প্রবচন","ভাগবত পাঠ প্রবচন বাংলা"],["রামায়ণ কথা","রামায়ণ কথা বাংলা"],["মহাভারত আলোচনা","মহাভারত আলোচনা বাংলা"],["গায়ত্রী মন্ত্র জপ","গায়ত্রী মন্ত্র"],["দুর্গা আরতি ও স্তোত্র","দুর্গা আরতি বাংলা"]].map(function(a){return{title:a[0],url:"https://www.youtube.com/results?search_query="+encodeURIComponent(a[1])}}));
function vid(){var VL=S.vl?S.videos:VFB;if(!VL.length)return '<h2>'+t("vid")+'</h2><p class="mu">'+t("novid")+'</p>';
return '<h2>'+t("vid")+'</h2><div class="grid">'+VL.map(function(v){return '<div class="card"><h3>'+esc(v.title)+'</h3><p><a href="'+esc(v.url)+'" target="_blank" rel="noopener">▶ '+t("watch")+'</a></p></div>'}).join("")+'</div>'}
function allBooks(){return [SEED_BOOK].concat(S.books)}
function lib(){var bs=allBooks();
if(openBook!==null){var b=bs.filter(function(x){return x.id===openBook})[0];if(b){var c=b.chapters[openCh]||{t:"",b:""};
return '<p><button class="btn" onclick="openBook=null;render()">'+t("back")+'</button></p><h2>'+esc(pick(b.title))+'</h2><p class="mu">'+t("by")+': '+esc(pick(b.author))+'</p><div class="row" style="margin:8px 0">'+b.chapters.map(function(x,i){return '<button class="btn '+(i===openCh?"p":"")+'" onclick="openCh='+i+';render()">'+esc(x.t)+'</button>'}).join("")+'</div><h3>'+esc(c.t)+'</h3><div class="read">'+esc(c.b)+'</div><div class="row" style="margin-top:10px"><button class="btn" '+(openCh<1?"disabled":"")+' onclick="openCh--;render()">‹ '+t("prev")+'</button><button class="btn" '+(openCh>=b.chapters.length-1?"disabled":"")+' onclick="openCh++;render()">'+t("next")+' ›</button></div>'}}
return '<h2>'+t("lib")+'</h2><div class="grid">'+bs.map(function(b){return '<div class="card click" onclick="openBook=\''+esc(b.id)+'\';openCh=0;render()"><h3>'+esc(pick(b.title))+'</h3><p>'+esc(pick(b.author))+' · '+bn(b.chapters.length)+' '+t("chap")+'</p></div>'}).join("")+'</div>'}
function man(){return '<h2>'+t("man")+'</h2>'+MANTRAS.map(function(m){return '<div class="card" style="margin:10px 0"><h3>'+pick(m.n)+'</h3><div class="sl">'+esc(m.s)+'</div></div>'}).join("")}
function adm(){if(!S.canEdit)return '<p class="mu">'+t("login")+'</p>';
var k=t("kinds");
var FLD={events:["date","title","kind"],videos:["title","url"],books:["title","author"]};
var items=function(arr,col,lab){return arr.map(function(x){
if(S.ed&&S.ed.col===col&&S.ed.id===x.id){return '<div class="card" style="margin:6px 0">'+FLD[col].map(function(f){return '<input id="ef_'+f+'" type="'+(f==="date"?"date":"text")+'" value="'+esc(pick(x[f]))+'" placeholder="'+f+'">'}).join("")+'<button class="btn p" onclick="saveEd()">'+(L==="bn"?"সংরক্ষণ":"Save")+'</button> <button class="btn" onclick="S.ed=null;render()">'+(L==="bn"?"বাতিল":"Cancel")+'</button></div>'}
return '<div class="row card" style="margin:6px 0"><span>'+esc(lab(x))+'</span><span><button class="btn" onclick="edt(\''+col+'\',\''+esc(x.id)+'\')">'+(L==="bn"?"সম্পাদনা":"Edit")+'</button> <button class="btn" onclick="rm(\''+col+'\',\''+esc(x.id)+'\')">'+t("del")+'</button></span></div>'}).join("")};
return '<h2>'+t("addEv")+'</h2><div class="card"><input type="date" id="ed"><input id="et" placeholder="'+t("title")+'"><select id="ek">'+k.map(function(x){return '<option>'+x+'</option>'}).join("")+'</select><button class="btn p" onclick="addEv()">'+t("add")+'</button></div>'+items(S.events.slice().sort(function(a,b){return a.date<b.date?-1:1}),"events",function(e){return e.date+" · "+e.title})
+'<h2>'+t("addVid")+'</h2><div class="card"><input id="vt" placeholder="'+t("title")+'"><input id="vu" placeholder="'+t("url")+'"><button class="btn p" onclick="addVid()">'+t("add")+'</button></div>'+items(S.videos,"videos",function(v){return v.title})
+'<h2>'+t("addBk")+'</h2><div class="card"><input id="bt" placeholder="'+t("title")+'"><input id="ba" placeholder="'+t("author")+'"><textarea id="bx" placeholder="'+t("txt")+'"></textarea><button class="btn p" onclick="addBk()">'+t("add")+'</button></div>'+items(S.books,"books",function(b){return pick(b.title)})+'<p id="msg" class="mu"></p>'}
function msg(s){var m=document.getElementById("msg");if(m)m.textContent=s}
function v(id){return document.getElementById(id).value.trim()}
function clr(a){a.forEach(function(i){var e=document.getElementById(i);if(e&&e.tagName!=="SELECT")e.value=""})}
function save(col,data,f){if(!S.db){msg(t("err"));return}msg(t("saving"));S.db.collection(col).add(data).then(function(){clr(f);msg("✓ "+(L==="bn"?"যোগ হয়েছে":"Added"))},function(e){msg(ec(e))})}
function ec(e){return t("err")+" ("+((e&&(e.code||e.message))||"")+")"}
function rm(col,id){if(!S.db){msg(t("err"));return}S.db.collection(col).doc(id).delete().then(function(){msg("✓")},function(e){msg(ec(e))})}
function edt(col,id){S.ed={col:col,id:id};render()}
function saveEd(){var e=S.ed;if(!e||!S.db)return;var o={};FLD[e.col].forEach(function(f){o[f]=document.getElementById("ef_"+f).value.trim()});
S.db.collection(e.col).doc(e.id).update(o).then(function(){S.ed=null;render();msg("✓ "+(L==="bn"?"সংরক্ষিত হয়েছে":"Saved"))},function(x){msg(ec(x))})}
function addEv(){if(!v("ed")||!v("et"))return;save("events",{date:v("ed"),title:v("et"),kind:v("ek")},["ed","et"])}
function addVid(){var u=v("vu");if(!v("vt")||!/^https:\/\//.test(u))return;save("videos",{title:v("vt"),url:u.split("?si=")[0]},["vt","vu"])}
function addBk(){var raw=document.getElementById("bx").value,ch=[],cur=null;
raw.split("\n").forEach(function(l){if(/^##\s/.test(l)){cur={t:l.replace(/^##\s*/,""),b:""};ch.push(cur)}else{if(!cur){cur={t:"1",b:""};ch.push(cur)}cur.b+=l+"\n"}});
ch.forEach(function(c){c.b=c.b.trim()});if(!v("bt")||!ch.length)return;
save("books",{title:v("bt"),author:v("ba"),chapters:ch},["bt","ba","bx"])}
function render(){document.documentElement.lang=L;document.getElementById("lang").textContent=L==="bn"?"English":"বাংলা";
document.getElementById("tag").textContent=t("tag");document.getElementById("foot").textContent=t("foot");nav();
var f={home:home,cal:cal,vid:vid,lib:lib,man:man,adm:adm}[tab()];
var ids=["ed","et","ek","vt","vu","bt","ba","bx"],sv={},ae=document.activeElement&&document.activeElement.id,mt=(document.getElementById("msg")||{}).textContent||"";
ids.forEach(function(i){var e=document.getElementById(i);if(e)sv[i]=e.value});
document.getElementById("app").innerHTML=f();
ids.forEach(function(i){var e=document.getElementById(i);if(e&&sv[i]!=null)e.value=sv[i]});
if(ae){var fe=document.getElementById(ae);if(fe&&fe.focus)fe.focus()}
msg(mt)}
document.getElementById("lang").onclick=function(){L=L==="bn"?"en":"bn";try{localStorage.setItem("l",L)}catch(e){}render()};
var TH=null;try{TH=localStorage.getItem("th")}catch(e){}
function isDark(){return TH?TH==="dark":window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches}
function applyTh(){if(TH)document.documentElement.setAttribute("data-theme",TH);var b=document.getElementById("theme");b.textContent=isDark()?"☀️":"🌙";b.title=isDark()?(L==="bn"?"লাইট মোড":"Light mode"):(L==="bn"?"ডার্ক মোড":"Dark mode")}
document.getElementById("theme").onclick=function(){TH=isDark()?"light":"dark";try{localStorage.setItem("th",TH)}catch(e){}applyTh()};
applyTh();
window.addEventListener("hashchange",render);
function sub(col,key){S.db.collection(col).onSnapshot(function(s){S[key]=s.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});if(key==="videos")S.vl=true;render()},function(){})}
render();
if(window.claude&&claude.use){
claude.use("user").then(function(u){if(u)return u.canEdit().then(function(c){S.canEdit=!!c;render()})}).catch(function(){});
claude.use("db").then(function(db){if(!db)return;S.db=db;sub("events","events");sub("videos","videos");sub("books","books")}).catch(function(){})}
</script>
</body>
</html>
